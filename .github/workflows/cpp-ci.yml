
name: C++ Linux DevSecOps Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Install coverage tool
      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      # 3. Configure Release build
      - name: Configure Release
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # 4. Compile and link
      - name: Build Release
        run: |
          cmake --build build \
            --config Release \
            --parallel 4

      # 5. Configure coverage build
      - name: Configure Coverage
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON

      # 6. Compile coverage build
      - name: Build Coverage
        run: |
          cmake --build build-coverage \
            --config Debug \
            --parallel 4

      # 7. Run coverage tests
      - name: Run Coverage Tests
        run: |
          ctest --test-dir build-coverage \
            -C Debug \
            --output-on-failure

      # 8. Generate coverage report
      - name: Generate Coverage
        run: |
          mkdir -p coverage

          gcovr \
            --root . \
            --filter 'src/' \
            --exclude 'src/main.cpp' \
            --sonarqube coverage/sonarqube.xml \
            build-coverage

      # 9. SonarQube analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 10. Quality Gate
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 11. Configure sanitizer build
      - name: Configure Sanitizers
        run: |
          cmake -S . -B build-sanitizer \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      # 12. Compile sanitizer build
      - name: Build With Sanitizers
        run: |
          cmake --build build-sanitizer \
            --config Debug \
            --parallel 4

      # 13. Execute sanitizer tests
      - name: Run Sanitizer Tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-sanitizer \
            -C Debug \
            --output-on-failure

      # 14. Install and package Release
      - name: Package Release
        run: |
          cmake --install build \
            --config Release \
            --prefix "$GITHUB_WORKSPACE/package"

          test -x package/bin/calculator

          tar -czf cpp-release.tar.gz \
            -C package .
    # Docker build
      - name: Build Docker Image
        run: |
            docker build \
            -t cpp-calculator:${{ github.sha }} .

        # Test container
      - name: Smoke Test Docker Container
        run: |
            docker run --rm \
            cpp-calculator:${{ github.sha }}

      # 15. Upload artifact
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-calculator-linux-release
          path: cpp-release.tar.gz
          if-no-files-found: error
          retention-days: 7
